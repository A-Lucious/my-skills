interface:
  display_name: "Pixel Art"
  short_description: "Create pixel art via Blender and Aseprite following character, scene, prop, and building specifications"
  default_prompt: "Using $pixel-art, execute the six-step production pipeline based on style and category specifications. After Blender modeling and lighting, invoke the fixed Pixel Shader from the style directory in Step 3 to preview the result in advance, then proceed to Aseprite rough drafting, refinement, and inspection."

dependencies:
  tools:
    - type: "mcp"
      value: "aseprite"
      description: "In-project Aseprite stdio MCP responsible for base import, pixel refinement, and formal export"
      transport: "stdio"

    - type: "mcp"
      value: "blender"
      description: "Blender Lab stdio MCP providing 3D blockout, render guidance, and direct pixel base export"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
