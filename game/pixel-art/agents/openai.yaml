interface:
  display_name: "Pixel Art"
  short_description: "Create pixel art assets, redraw references, and define reusable styles"
  default_prompt: "Use $pixel-art to create an asset through the pre-light structural Sobel, protected SOFT.04, and constrained Aseprite cleanup production baseline, or redraw a supplied reference image with the Aseprite-only pure-draw baseline, or use its create-style command to define and save a new style through an interview."

dependencies:
  tools:
    - type: "mcp"
      value: "aseprite"
      description: "In-project Aseprite stdio MCP responsible for base import, pixel refinement, and formal export"
      transport: "stdio"

    - type: "mcp"
      value: "blender"
      description: "Blender Lab stdio MCP providing 3D blockout, render guidance, and direct pixel base export"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
